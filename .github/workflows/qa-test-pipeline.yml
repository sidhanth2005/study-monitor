==================================================
LIVE APPLICATION
==================================================

The Selenium tests must run against the LIVE deployed application.

Never use localhost.

Define:

BASE_URL

as a configurable GitHub Actions variable/environment variable.

Example:

BASE_URL=https://sidhanth2005.github.io/study-monitor/

Do not hardcode BASE_URL throughout the test code.

All Selenium page objects and tests must use BASE_URL.

==================================================
FIVE PARALLEL JOBS
==================================================

Create these jobs:

selenium:
name: Selenium Web E2E

appium:
name: Appium Mobile E2E

unit:
name: Unit Testing

security:
name: Vulnerability & Security

load:
name: Load & Performance

Run them independently in parallel.

Then create:

aggregate:

name: Aggregate QA Report

The aggregate job must depend on all five QA jobs.

Use:

if: always()

so reports are generated even when one suite has failures.

