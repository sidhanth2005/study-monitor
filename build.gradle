buildscript {
    ext {
        compose_version = '1.6.8'
        hilt_version = '2.51.1'
        room_version = '2.6.1'
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
    }
}